name: Build TiziOverlay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "TiziOverlay.m"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version

      - name: Build ARM64 iOS dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p build

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=13.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -fmodules \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -Wl,-install_name,@rpath/TiziOverlay.dylib \
            -Wl,-dead_strip \
            TiziOverlay.m \
            -o build/TiziOverlay.dylib

      - name: Ad-hoc sign dylib
        run: |
          codesign --force --sign - build/TiziOverlay.dylib
          codesign -dv --verbose=4 build/TiziOverlay.dylib || true

      - name: Verify binary
        run: |
          file build/TiziOverlay.dylib
          lipo -info build/TiziOverlay.dylib
          otool -L build/TiziOverlay.dylib

      - name: Create SHA256
        run: |
          shasum -a 256 build/TiziOverlay.dylib | tee build/TiziOverlay.dylib.sha256

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiziOverlay-dylib
          path: |
            build/TiziOverlay.dylib
            build/TiziOverlay.dylib.sha256
          if-no-files-found: error
