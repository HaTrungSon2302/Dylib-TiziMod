name: Build TiziReplace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "TiziReplace.m"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ARM64 iOS dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=13.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -fmodules \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -Wl,-install_name,@rpath/TiziReplace.dylib \
            -Wl,-dead_strip \
            TiziReplace.m \
            -o build/TiziReplace.dylib

      - name: Ad-hoc sign
        run: |
          codesign --force --sign - build/TiziReplace.dylib

      - name: Verify
        run: |
          file build/TiziReplace.dylib
          lipo -info build/TiziReplace.dylib
          otool -L build/TiziReplace.dylib

      - name: SHA256
        run: |
          shasum -a 256 build/TiziReplace.dylib | tee build/TiziReplace.dylib.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiziReplace-dylib
          path: |
            build/TiziReplace.dylib
            build/TiziReplace.dylib.sha256
          if-no-files-found: error
